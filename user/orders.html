<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders – FoodExpress</title>
  <meta name="description" content="View your past and active food delivery orders on FoodExpress.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/user.css">
</head>
<body>

  <!-- Protected User Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="home.html" class="brand-logo">
        <span class="logo-icon">🍔</span>
        <span>Food<span class="accent">Express</span></span>
      </a>

      <nav class="nav-links">
        <a href="home.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="cart.html" class="nav-link">Cart</a>
        <a href="orders.html" class="nav-link active">My Orders</a>
        <a href="profile.html" class="nav-link">Profile</a>
        <a href="javascript:void(0)" onclick="logoutUser()" class="nav-link" style="color: var(--status-cancelled);">Logout 🚪</a>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="cart-btn-link" title="Shopping Cart">
          🛒
          <span class="cart-badge" style="display: none;">0</span>
        </a>
        <div id="nav-user-info"></div>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
      </div>
    </div>
  </header>

  <!-- Orders Content -->
  <main class="container container-sm" style="padding-top: 2rem; padding-bottom: 4rem;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem;">
      <div>
        <span class="section-tag">Account History</span>
        <h1 style="font-size: 2.25rem;">My Orders 📋</h1>
      </div>
      <a href="menu.html" class="btn btn-outline btn-sm">Order Food 🍽️</a>
    </div>

    <!-- Orders Container -->
    <div id="user-orders-container" class="orders-list">
      <!-- Filled via orders.js renderUserOrdersPage() -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom" style="border:none; padding-top: 1rem;">
      <p>&copy; 2026 FoodExpress. Online Food Delivery System.</p>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/food.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script>
    checkUserAuth();

    document.addEventListener('DOMContentLoaded', () => {
      renderUserOrdersPage();
    });
  </script>
</body>
</html>
