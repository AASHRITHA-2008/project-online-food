<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart – FoodExpress</title>
  <meta name="description" content="View items in your FoodExpress shopping cart, adjust quantities, and proceed to checkout.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/user.css">
</head>
<body>

  <!-- Protected User Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="home.html" class="brand-logo">
        <span class="logo-icon">🍔</span>
        <span>Food<span class="accent">Express</span></span>
      </a>

      <nav class="nav-links">
        <a href="home.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="cart.html" class="nav-link active">Cart</a>
        <a href="orders.html" class="nav-link">My Orders</a>
        <a href="profile.html" class="nav-link">Profile</a>
        <a href="javascript:void(0)" onclick="logoutUser()" class="nav-link" style="color: var(--status-cancelled);">Logout 🚪</a>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="cart-btn-link" title="Shopping Cart">
          🛒
          <span class="cart-badge" style="display: none;">0</span>
        </a>
        <div id="nav-user-info"></div>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
      </div>
    </div>
  </header>

  <!-- Cart Main -->
  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
    <div style="margin-bottom: 1.5rem;">
      <span class="section-tag">Review & Order</span>
      <h1 style="font-size: 2.25rem;">Your Food Cart 🛒</h1>
    </div>

    <div class="cart-layout">
      <!-- Items Container (left) -->
      <div class="cart-items-card" id="cart-items-container">
        <!-- Rendered via cart.js -->
      </div>

      <!-- Order Summary Card (right) -->
      <div id="cart-summary-container">
        <!-- Rendered via cart.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom" style="border:none; padding-top: 1rem;">
      <p>&copy; 2026 FoodExpress. Fast & Secure Checkout.</p>
      <div style="display: flex; gap: 1.5rem;">
        <a href="menu.html">Continue Ordering</a>
        <a href="orders.html">Order History</a>
      </div>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/food.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    checkUserAuth();

    document.addEventListener('DOMContentLoaded', () => {
      renderCartPage();
    });
  </script>
</body>
</html>
